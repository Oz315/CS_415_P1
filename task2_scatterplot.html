<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Insertion Sort — Timing (Hover Tooltips)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root { --fg:#111827; --muted:#6b7280; --border:#e5e7eb; --card:#ffffff; --bg:#f8fafc; }
        html, body { margin:0; padding:0; background:var(--bg); color:var(--fg); font-family:system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans", sans-serif; }
        .container { max-width: 1040px; margin: 24px auto; padding: 0 16px; }
        h1 { font-size: 1.25rem; margin: 0 0 12px 0; }
        .card { background: var(--card); border:1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .row { display:flex; gap:12px; flex-wrap: wrap; align-items: center; }
        .sliderLabel { display:flex; align-items:center; gap:8px; }
        .sliderLabel input[type=range] { width: 220px; }
        .sliderLabel span { color: var(--muted); min-width: 56px; display:inline-block; }

        label { display:flex; align-items:center; gap:8px; }
        input[type="file"] { padding:6px 8px; }
        #chart { height: 500px; position: relative; }
        .legend { display:flex; gap:12px; flex-wrap: wrap; margin-top: 8px; }
        .badge { display:inline-flex; align-items:center; gap:8px; padding:4px 10px; border:1px solid var(--border); border-radius: 999px; background:#fff; font-size: 12px; }
        .dot { width:10px; height:10px; border-radius:999px; display:inline-block; }
        .footer { color: var(--muted); font-size: .9rem; margin-top: 12px; }
        .axis text { font-size: 12px; fill: #374151; }
        .axis path, .axis line { stroke: #94a3b8; }
        .grid line { stroke: #e5e7eb; }
        .grid .domain { display: none; }
        .title { font-weight: 600; margin-bottom: 6px; }
        button { padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: #f9fafb; cursor: pointer; }
        button:hover { background:#f3f4f6; }
        /* Tooltip */
        .tooltip {
            position: fixed;
            pointer-events: none;
            background: #fff;
            border: 1px solid var(--border);
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 12px;
            color: var(--fg);
            z-index: 20;
            white-space: nowrap;
        }
        .tooltip .hdr { font-weight: 600; margin-bottom: 2px; }
        .tooltip .sub { color: var(--muted); }
    </style>
</head>
<body>
<div class="container">
    <h1>Task 2: Exponentiation</h1>

    <div class="card">
        <div class="row">
            <label>CSV file <input type="file" id="file" accept=".csv" /></label>
            <button id="useDefault">Load example data</button>

            <label>Y metric
                <select id="yMetric">
                    <option value="elapsed_ms" selected>elapsed_ms</option>
                    <option value="ops_total">ops_total</option>
                </select>
            </label>
            <label>X scale
                <select id="xScale">
                    <option value="log2" selected>log₂</option>
                    <option value="linear">linear</option>
                </select>
            </label>
            <label><input type="checkbox" id="toggleNlogN"> Show N and N² baselines (anchored to best_case / worst_case)</label>
            <label class="sliderLabel">Max N <input type="range" id="maxExp" /> <span id="maxExpLabel"></span></label>
        </div>
    </div>

    <div id="chart" class="card"></div>
    <div id="legend" class="legend"></div>
    <div class="footer">
        X-axis can be log₂-scaled or linear (use the selector above). Tick marks follow powers of two from your data range.<br/>
        Expected columns: <code>impl,N,elapsed_ms,ops_total</code>
    </div>
</div>

<!-- D3 v7 CDN -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script>
    // Default CSV (refreshed; removed the highest quadratic row as requested)
    const defaultCsv = `impl,N,elapsed_ms,ops_total
decrease_by_one,2,5,1
decrease_by_one,4,7,3
decrease_by_one,8,15,7
decrease_by_one,16,25,15
decrease_by_one,32,60,31
decrease_by_one,64,120,63
decrease_by_one,128,250,127
decrease_by_one,256,500,255
decrease_by_one,512,1000,511
decrease_by_one,1024,2000,1023
decrease_by_one,2048,4000,2047
decrease_by_constant_factor,2,4,1
decrease_by_constant_factor,4,7,6
decrease_by_constant_factor,8,20,28
decrease_by_constant_factor,16,75,120
decrease_by_constant_factor,32,300,496
decrease_by_constant_factor,64,1000,2016
decrease_by_constant_factor,128,3000,8128
decrease_by_constant_factor,256,10000,32640
decrease_by_constant_factor,512,40000,130816
decrease_by_constant_factor,1024,160000,523776
decrease_by_constant_factor,2048,640000,2096128
divide_and_conquer,2,4,1
divide_and_conquer,4,7,9
divide_and_conquer,8,20,36
divide_and_conquer,16,75,140
divide_and_conquer,32,300,526
divide_and_conquer,64,1000,2500
divide_and_conquer,128,3000,8200
divide_and_conquer,256,10000,34575
divide_and_conquer,512,40000,140816
divide_and_conquer,1024,160000,533776
divide_and_conquer,2048,640000,2086128`;
    

    // Fixed colors + fallback palette
    const fixedColors = {
        decrease_by_one:  '#2ca02c', // green
        decrease_by_constant_factor: '#d62728',  // red
        divide_and_conquer: '#17becf' // teal
    };
    const fallbackPalette = [
        '#d62728', // red
        '#9467bd', // purple
        '#8c564b', // brown
        '#e377c2', // pink
        '#7f7f7f', // gray
        '#bcbd22', // olive
        '#17becf'  // teal
    ];

    let allRows = [];
    const fileInput = document.getElementById('file');
    const useDefaultBtn = document.getElementById('useDefault');
    const toggleNlogN = document.getElementById('toggleNlogN');
    const yMetricSel = document.getElementById('yMetric');
    const xScaleSel = document.getElementById('xScale');
    const maxExpInput = document.getElementById('maxExp');
    const maxExpLabel = document.getElementById('maxExpLabel');
    let powRange = {minPow: 1, maxPow: 1};

    function computePowRange(rows) {
        const clean = rows.filter(r => Number.isFinite(r.N) && r.N > 0);
        if (!clean.length) return {minPow: 1, maxPow: 1};
        const Nmin = d3.min(clean, d => d.N);
        const Nmax = d3.max(clean, d => d.N);
        return {
            minPow: Math.ceil(Math.log2(Nmin)),
            maxPow: Math.floor(Math.log2(Nmax))
        };
    }

    function setupSlider(rows) {
        if (!maxExpInput) return;
        powRange = computePowRange(rows);
        maxExpInput.min = powRange.minPow;
        maxExpInput.max = powRange.maxPow;
        maxExpInput.step = 1;
        maxExpInput.value = powRange.maxPow;
        if (maxExpLabel) maxExpLabel.textContent = `2^${maxExpInput.value}`;
    }


    // Tooltip element (global)
    const tooltip = d3.select('body').append('div')
        .attr('class', 'tooltip')
        .style('opacity', 0);

    useDefaultBtn.addEventListener('click', () => {
        const rows = d3.csvParse(defaultCsv.trim());
        rows.forEach(r => { r.N = +r.N; r.elapsed_ms = +r.elapsed_ms; r.ops_total = +r.ops_total; });
        allRows = rows;
        setupSlider(rows);
        render();
    });
    toggleNlogN.addEventListener('change', render);
    if (yMetricSel) yMetricSel.addEventListener('change', render);
    if (xScaleSel) xScaleSel.addEventListener('change', render);
    if (maxExpInput) {
        maxExpInput.addEventListener('input', () => {
            if (maxExpLabel) maxExpLabel.textContent = `2^${maxExpInput.value}`;
            render();
        });
    }


    fileInput.addEventListener('change', e => {
        const f = e.target.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
            const text = reader.result.replace(/\r\n/g, '\n').trim();
            const rows = d3.csvParse(text);
            rows.forEach(r => { r.N = +r.N; r.elapsed_ms = +r.elapsed_ms; r.ops_total = +r.ops_total; });
            allRows = rows;
            setupSlider(rows);
            render();
        };
        reader.readAsText(f);
    });

    function render() {
        // Apply max-N slider (by exponent) and filter invalid rows
        const maxPowLimit = (maxExpInput && Number.isFinite(+maxExpInput.value)) ? +maxExpInput.value : Infinity;
        const maxNLimit = Number.isFinite(maxPowLimit) ? (2 ** maxPowLimit) : Infinity;
        const yField = (yMetricSel && yMetricSel.value) ? yMetricSel.value : 'elapsed_ms';
        const rows = allRows.filter(r =>
            Number.isFinite(r.N) && r.N > 0 &&
            Number.isFinite(r[yField]) &&
            r.N <= maxNLimit
        );
        const byImpl = d3.groups(rows, d => d.impl);
        byImpl.forEach(([impl, arr]) => arr.sort((a,b)=>a.N-b.N));

        const container = d3.select('#chart');
        container.selectAll('*').remove();

        const margin = {top: 24, right: 34, bottom: 56, left: 76}; // right +10 as requested
        const width = Math.max(360, container.node().clientWidth) - margin.left - margin.right;
        const height = 500 - margin.top - margin.bottom;

        const svg = container.append('svg')
            .attr('width', width + margin.left + margin.right)
            .attr('height', height + margin.top + margin.bottom);

        const g = svg.append('g').attr('transform', `translate(${margin.left},${margin.top})`);

        if (!rows.length) {
            g.append('text')
                .attr('x', width/2).attr('y', height/2)
                .attr('text-anchor', 'middle')
                .style('fill', '#6b7280')
                .text('Load a CSV (or click “Load example data”)');
            d3.select('#legend').html('');
            return;
        }

        // X: either log₂ scale (base 2) or linear, based on selector
        const Nmin = d3.min(rows, d => d.N);
        const Nmax = d3.max(rows, d => d.N);
        const minPow = Math.ceil(Math.log2(Nmin));
        const maxPow = Math.floor(Math.log2(Nmax));
        const xTicks = d3.range(minPow, maxPow + 1).map(k => 2 ** k);

        const xMode = (xScaleSel && xScaleSel.value) ? xScaleSel.value : 'log2';

        const x = (xMode === 'linear')
            ? d3.scaleLinear().domain([2 ** minPow, 2 ** maxPow]).range([0, width])
            : d3.scaleLog().base(2).domain([2 ** minPow, 2 ** maxPow]).range([0, width]);

        // Y: elapsed_ms linear (no locking)
        const yMax = d3.max(rows, d => d[yField]);
        const y = d3.scaleLinear()
            .domain([0, yMax]).nice()
            .range([height, 0]);

        // Axes & grid
        const xAxis = d3.axisBottom(x)
            .tickValues(xTicks)
            .tickFormat(d => (xMode === 'linear' ? `${d}` : `2^${Math.round(Math.log2(d))}`));
        const yAxis = d3.axisLeft(y).ticks(8);

        const xGrid = d3.axisBottom(x).tickValues(xTicks).tickSize(-height).tickFormat('');
        const yGrid = d3.axisLeft(y).ticks(8).tickSize(-width).tickFormat('');

        g.append('g').attr('class','grid').attr('transform', `translate(0,${height})`).call(xGrid);
        g.append('g').attr('class','grid').call(yGrid);

        g.append('g').attr('class','axis').attr('transform', `translate(0,${height})`).call(xAxis);
        g.append('g').attr('class','axis').call(yAxis);

        g.append('text').attr('x', width/2).attr('y', height+42).attr('text-anchor','middle').text(xMode === 'linear' ? 'N' : 'N (2^k)');
        g.append('text').attr('transform','rotate(-90)').attr('x', -height/2).attr('y', -56).attr('text-anchor','middle').text(yField);

        // Build a color map for implementations (fixed first, then fallback palette as needed)
        const assigned = new Map();
        let fp = 0;
        byImpl.forEach(([impl]) => {
            assigned.set(impl, fixedColors[impl] || fallbackPalette[(fp++) % fallbackPalette.length]);
        });

        // Line + points per impl
        const line = d3.line()
            .x(d => x(d.N))
            .y(d => y(d[yField]))
            .curve(d3.curveMonotoneX);

        byImpl.forEach(([impl, arr]) => {
            const col = assigned.get(impl);
            g.append('path')
                .datum(arr)
                .attr('fill','none')
                .attr('stroke', col)
                .attr('stroke-width', 2.5)
                .attr('d', line);

            g.selectAll(`.pt-${cssSafe(impl)}`)
                .data(arr)
                .enter().append('circle')
                .attr('class', `pt-${cssSafe(impl)}`)
                .attr('r', 4)
                .attr('cx', d => x(d.N))
                .attr('cy', d => y(d[yField]))
                .attr('fill', col)
                .on('mouseenter', function(evt, d) {
                    const k = Math.log2(d.N);
                    const powLabel = Number.isInteger(k) ? ` (2^${k})` : '';
                    const metricVal = d[yField];
                    const otherField = (yField === 'elapsed_ms') ? 'ops_total' : 'elapsed_ms';
                    const otherVal = d[otherField];

                    const metricFmt = (yField === 'ops_total')
                        ? (Number.isFinite(metricVal) ? Math.round(metricVal).toLocaleString() : '—')
                        : (Number.isFinite(metricVal) ? (+metricVal).toFixed(3) : '—');

                    const otherFmt = (otherField === 'ops_total')
                        ? (Number.isFinite(otherVal) ? Math.round(otherVal).toLocaleString() : '—')
                        : (Number.isFinite(otherVal) ? (+otherVal).toFixed(3) : '—');

                    const html = `<div class="hdr">${d.impl}</div>
                        <div class="sub">N = ${d.N}${powLabel}</div>
                        <div>${yField} = ${metricFmt}</div>
                        <div class="sub">${otherField} = ${otherFmt}</div>`;
                    tooltip.html(html)
                        .style('opacity', 1)
                        .style('border-left', `4px solid ${assigned.get(d.impl)}`);
                    d3.select(this).attr('r', 6);
                })
                .on('mousemove', function(evt) {
                    const pad = 12;
                    const xPos = evt.clientX + pad;
                    const yPos = evt.clientY + pad;
                    tooltip.style('left', `${xPos}px`).style('top', `${yPos}px`);
                })
                .on('mouseleave', function() {
                    tooltip.style('opacity', 0);
                    d3.select(this).attr('r', 4);
                });
        });

        // Optional theory baselines (dashed gray): N and N^2
        // - N is anchored to best_case at its leftmost N (if present)
        // - N^2 is anchored to worst_case at its leftmost N (if present)
        let drewBaselineN = false;
        let drewBaselineN2 = false;

        if (toggleNlogN.checked) {
            // N baseline (anchor to best_case)
            const bestRows = rows.filter(r => r.impl === 'decrease_by_one');
            if (bestRows.length) {
                const leftN = d3.min(bestRows, d => d.N);
                const ref = d3.mean(bestRows.filter(r => r.N === leftN), d => d[yField]);
                const scale = ref / leftN;
                const baselineN = xTicks.map(N => ({ N, y: scale * N }));
                const baselineLine = d3.line()
                    .x(d => x(d.N))
                    .y(d => y(d.y))
                    .curve(d3.curveMonotoneX);

                g.append('path')
                    .datum(baselineN)
                    .attr('fill', 'none')
                    .attr('stroke', '#6b7280')
                    .attr('stroke-dasharray', '6,4')
                    .attr('stroke-width', 2)
                    .attr('d', baselineLine);
                drewBaselineN = true;
            }

            // N^2 baseline (anchor to worst_case)
            const worstRows = rows.filter(r => r.impl === 'decrease_by_constant_factor');
            if (worstRows.length) {
                const leftN = d3.min(worstRows, d => d.N);
                const ref = d3.mean(worstRows.filter(r => r.N === leftN), d => d[yField]);
                const scale = ref / (leftN * leftN);
                const baselineN2 = xTicks.map(N => ({ N, y: scale * N * N }));
                const baselineLine2 = d3.line()
                    .x(d => x(d.N))
                    .y(d => y(d.y))
                    .curve(d3.curveMonotoneX);

                g.append('path')
                    .datum(baselineN2)
                    .attr('fill', 'none')
                    .attr('stroke', '#6b7280')
                    .attr('stroke-dasharray', '2,4')
                    .attr('stroke-width', 2)
                    .attr('d', baselineLine2);
                drewBaselineN2 = true;
            }
        }

        // Legend
        const legend = d3.select('#legend');
        legend.html('');
        byImpl.forEach(([impl]) => {
            const item = legend.append('div').attr('class','badge');
            item.append('span').attr('class','dot').style('background', assigned.get(impl));
            item.append('span').text(impl);
        });

        if (drewBaselineN) {
            const item = legend.append('div').attr('class','badge');
            const swatch = item.append('span').attr('class','dot');
            swatch.style('border', '2px dashed #6b7280')
                .style('background', 'transparent')
                .style('width','12px')
                .style('height','12px');
            item.append('span').text('N baseline (anchored to best_case)');
        }
        if (drewBaselineN2) {
            const item = legend.append('div').attr('class','badge');
            const swatch = item.append('span').attr('class','dot');
            swatch.style('border', '2px dashed #6b7280')
                .style('border-style', 'dotted')
                .style('background', 'transparent')
                .style('width','12px')
                .style('height','12px');
            item.append('span').text('N^2 baseline (anchored to worst_case)');
        }
    }

    function cssSafe(s) {
        return String(s).replace(/[^a-zA-Z0-9_-]/g, '_');
    }

    // Auto-load the example on first paint
    (function init() {
        const rows = d3.csvParse(defaultCsv.trim());
        rows.forEach(r => { r.N = +r.N; r.elapsed_ms = +r.elapsed_ms; r.ops_total = +r.ops_total; });
        allRows = rows;
        setupSlider(rows);
        render();
    })();
</script>
</body>
</html>
